name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run black
      run: black --check src/ tests/ scripts/ demo/
    
    - name: Run ruff
      run: ruff check src/ tests/ scripts/ demo/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  inference-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Test synthetic data training
      run: |
        python scripts/train.py --synthetic --model_type simple --num_epochs 2 --batch_size 16
    
    - name: Test model inference
      run: |
        python -c "
        import torch
        import numpy as np
        from src.models.chord_models import create_model
        from src.features.extractors import FeatureExtractor
        
        # Create model and extractor
        model = create_model('simple', input_size=12, num_classes=25)
        extractor = FeatureExtractor(sample_rate=22050)
        
        # Generate synthetic audio
        duration = 3.0
        sr = 22050
        t = np.linspace(0, duration, int(duration * sr))
        audio = np.sin(2 * np.pi * 440 * t)
        
        # Extract features and predict
        features = extractor.extract_features(audio)
        chroma = features['chroma']
        chroma_tensor = torch.tensor(chroma.mean(axis=1), dtype=torch.float32).unsqueeze(0)
        
        # Predict
        model.eval()
        with torch.no_grad():
            outputs = model(chroma_tensor)
            predicted_class = torch.argmax(outputs, dim=1).item()
        
        print(f'Predicted chord class: {predicted_class}')
        assert 0 <= predicted_class < 25
        print('Inference test passed!')
        "

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, inference-test]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/
